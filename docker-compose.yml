services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: central_balancos
      POSTGRES_PASSWORD: central_balancos
      POSTGRES_DB: central_balancos
    ports:
      # Só a própria máquina: a senha do desenvolvimento é trivial, e "5432:5432" a publicaria em toda a rede (Wi-Fi do escritório).
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_balancos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
